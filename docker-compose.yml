# PortalT docker-compose.yml (Phase 0: PostgreSQL + Caddy)
# Phase 3+ 将加入 backend / frontend / guacamole 服务

name: portalt

services:
  postgres:
    image: postgres:15
    container_name: portalt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-portalt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
      POSTGRES_DB: ${DB_NAME:-portalt}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portalt} -d ${DB_NAME:-portalt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: portalt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
