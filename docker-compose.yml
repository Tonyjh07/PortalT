# PortalT docker-compose.yml (Phase 0: PostgreSQL + Caddy)
# Phase 8: + guacd（Guacamole 协议守护进程）与 VNC 演示目标

name: portalt

services:
  postgres:
    image: postgres:15
    container_name: portalt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-portalt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
      POSTGRES_DB: ${DB_NAME:-portalt}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portalt} -d ${DB_NAME:-portalt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Guacamole 协议守护进程（Phase 8）：接收 PortalT 隧道的原生指令，
  # 解析 VNC/RDP 协议渲染桌面。浏览器不直接接触 guacd，
  # 仅经 PortalT 后端（GUACD_URL=guacd:4822）接入。
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: portalt-guacd
    restart: unless-stopped
    ports:
      - "4822:4822"
    extra_hosts:
      # guacd 经宿主机访问演示 VNC 目标（Linux 需显式网关；Docker Desktop 自带）
      - "host.docker.internal:host-gateway"

  # VNC 演示目标（Phase 8）：mock 虚拟机 metadata 指向本容器（5900）。
  # 生产环境请替换为真实虚拟机并更新 VM metadata 连接参数。
  vnc-demo:
    image: dorowu/ubuntu-desktop-lxde-vnc
    container_name: portalt-vnc-demo
    restart: unless-stopped
    environment:
      VNC_PASSWORD: portalt-demo
      VNC_RESOLUTION: 1280x800
    ports:
      - "5900:5900"

  caddy:
    image: caddy:2
    container_name: portalt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
