<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定时任务</title>
<style>
  :root { color-scheme: light; }
  html.dark { color-scheme: dark; }

  :root {
    --bg: #f5f6fa;
    --bg-glow-1: rgba(99, 102, 241, .12);
    --bg-glow-2: rgba(34, 211, 238, .10);
    --card: rgba(255, 255, 255, .85);
    --card-border: #e5e7f0;
    --text: #1c2130;
    --text-2: #5b6478;
    --text-3: #8a93a8;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --code-bg: #1e2233;
    --ok: #22c55e;
    --off: #94a3b8;
    --shadow: 0 20px 50px -20px rgba(30, 41, 80, .25);
  }

  html.dark {
    --bg: #0f1117;
    --bg-glow-1: rgba(99, 102, 241, .22);
    --bg-glow-2: rgba(34, 211, 238, .12);
    --card: rgba(255, 255, 255, .04);
    --card-border: rgba(255, 255, 255, .09);
    --text: #e6e9f2;
    --text-2: #9aa3b8;
    --text-3: #6b7488;
    --code-bg: #171a26;
    --shadow: 0 20px 50px -20px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.65 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 32px 28px;
    transition: background .3s, color .3s;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(600px 400px at 15% 0%, var(--bg-glow-1), transparent 65%),
                radial-gradient(700px 500px at 100% 100%, var(--bg-glow-2), transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 24px -8px var(--accent);
  }
  .logo svg { width: 24px; height: 24px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header p { font-size: 13px; color: var(--text-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .job {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 18px 20px; backdrop-filter: blur(12px);
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
  }
  .job-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .job-head h2 { font-size: 15px; font-weight: 600; }
  .job-head .desc { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--card-border); color: var(--text-2);
  }
  .badge .pulse { width: 7px; height: 7px; border-radius: 50%; }
  .badge.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .badge.on .pulse { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .badge.off { color: var(--off); }
  .badge.off .pulse { background: var(--off); }

  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 12.5px; }
  .meta .k { color: var(--text-3); }
  .meta .v { color: var(--text); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

  .job-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 10px; padding: 7px 14px; font-size: 12.5px;
    cursor: pointer; text-decoration: none; transition: transform .15s, opacity .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 600; box-shadow: 0 8px 20px -8px var(--accent);
  }
  .btn-ghost { background: transparent; border: 1px solid var(--card-border); color: var(--text-2); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }

  /* 开关（与门户主题观感一致的极简开关） */
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
    background: var(--card-border); transition: background .25s;
  }
  .switch .thumb {
    position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .25s;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track .thumb { transform: translateX(18px); }

  .panel {
    margin-top: 22px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 16px 20px; backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .log-row {
    display: flex; gap: 12px; align-items: baseline; padding: 7px 0;
    border-bottom: 1px dashed var(--card-border); font-size: 12.5px;
  }
  .log-row:last-child { border-bottom: 0; }
  .log-row .t { color: var(--text-3); font-family: Consolas, monospace; flex: none; font-variant-numeric: tabular-nums; }
  .log-row .n { font-weight: 600; flex: none; }
  .log-row .d { color: var(--text-2); }
  .empty { color: var(--text-3); font-size: 13px; padding: 10px 0; }

  @media (max-width: 640px) {
    body { padding: 20px 16px; }
    .meta { grid-template-columns: 1fr; }
    .meta .v { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3.5 2"/>
      </svg>
    </div>
    <div>
      <h1>定时任务</h1>
      <p>示例插件：内存版调度器，重启后端后任务与日志重置</p>
    </div>
  </header>

  <div class="grid" id="jobs"></div>

  <div class="panel">
    <h2>执行日志</h2>
    <div id="logs"><div class="empty">暂无日志</div></div>
  </div>
</div>

<script>
const API = '/api/v1/plugins/native/cron';

// ---- 主题同步：与门户 useTheme.ts 使用同一 localStorage 键 ----
function applyTheme() {
  const saved = localStorage.getItem('portalt-theme');
  const dark = saved === 'dark'
    || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}
applyTheme();
window.addEventListener('storage', e => { if (e.key === 'portalt-theme') applyTheme(); });
try {
  const parentEl = window.parent.document.documentElement;
  if (parentEl && parentEl !== document.documentElement) {
    new MutationObserver(() => {
      document.documentElement.classList.toggle('dark', parentEl.classList.contains('dark'));
    }).observe(parentEl, { attributes: true, attributeFilter: ['class'] });
  }
} catch (e) { /* 跨域忽略 */ }

function token() {
  const m = document.cookie.match(/(?:^|;\s*)access_token=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

async function call(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token() },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || ('HTTP ' + res.status));
  return body.data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(t) {
  if (!t) return '—';
  const d = new Date(t);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function relTime(t) {
  if (!t) return '—';
  const diff = new Date(t) - Date.now();
  if (diff <= 0) return '即将执行';
  const m = Math.floor(diff / 60000);
  if (m < 60) return m + ' 分钟后';
  const h = Math.floor(m / 60);
  return h + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : '') + ' 后';
}

const jobsEl = document.getElementById('jobs');
const logsEl = document.getElementById('logs');
let busy = false;

async function renderJobs() {
  const jobs = await call('/jobs');
  jobsEl.innerHTML = jobs.map(j => `
    <div class="job">
      <div class="job-head">
        <div>
          <h2>${esc(j.name)}</h2>
          <div class="desc">${esc(j.desc)}</div>
        </div>
        <span class="badge ${j.enabled ? 'on' : 'off'}"><span class="pulse"></span>${j.enabled ? '启用' : '停用'}</span>
      </div>
      <div class="meta">
        <span class="k">周期</span><span class="v">${esc(j.schedule)}</span>
        <span class="k">上次执行</span><span class="v">${fmtTime(j.last_run)}</span>
        <span class="k">下次执行</span><span class="v">${fmtTime(j.next_run)}（${relTime(j.next_run)}）</span>
        <span class="k">执行次数</span><span class="v">${j.run_count}</span>
      </div>
      <div class="job-actions">
        <label class="switch" title="${j.enabled ? '停用' : '启用'}">
          <input type="checkbox" ${j.enabled ? 'checked' : ''} data-toggle="${esc(j.id)}">
          <span class="track"><span class="thumb"></span></span>
        </label>
        <button class="btn btn-primary" data-run="${esc(j.id)}">立即执行</button>
      </div>
    </div>`).join('');
}

function renderLogs(logs) {
  logsEl.innerHTML = logs.length
    ? logs.map(l => `
      <div class="log-row">
        <span class="t">${fmtTime(l.time)}</span>
        <span class="n">${esc(l.job_name)}</span>
        <span class="d">${esc(l.detail)}</span>
      </div>`).join('')
    : '<div class="empty">暂无日志</div>';
}

async function refresh() {
  try {
    await renderJobs();
    renderLogs(await call('/logs'));
  } catch (e) {
    logsEl.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

jobsEl.addEventListener('click', async (e) => {
  if (busy) return;
  const runBtn = e.target.closest('[data-run]');
  const toggle = e.target.closest('[data-toggle]');
  if (!runBtn && !toggle) return;
  busy = true;
  try {
    if (runBtn) {
      runBtn.disabled = true;
      await call(`/jobs/${encodeURIComponent(runBtn.dataset.run)}/run`, { method: 'POST' });
    } else if (toggle) {
      await call(`/jobs/${encodeURIComponent(toggle.dataset.toggle)}/toggle`, { method: 'POST' });
    }
    await refresh();
  } catch (err) {
    logsEl.innerHTML = `<div class="empty">操作失败：${esc(err.message)}</div>`;
  } finally {
    busy = false;
  }
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
