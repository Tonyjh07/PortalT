<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESXi 管理</title>
<style>
  :root { color-scheme: light; }
  html.dark { color-scheme: dark; }

  :root {
    --bg: #f5f6fa;
    --bg-glow-1: rgba(99, 102, 241, .12);
    --bg-glow-2: rgba(34, 211, 238, .10);
    --card: rgba(255, 255, 255, .85);
    --card-border: #e5e7f0;
    --text: #1c2130;
    --text-2: #5b6478;
    --text-3: #8a93a8;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --code-bg: #1e2233;
    --code-text: #d6dbe9;
    --code-border: #2a2f45;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bad: #94a3b8;
    --frame-bar: rgba(255, 255, 255, .8);
    --shadow: 0 20px 50px -20px rgba(30, 41, 80, .25);
  }

  html.dark {
    --bg: #0f1117;
    --bg-glow-1: rgba(99, 102, 241, .22);
    --bg-glow-2: rgba(34, 211, 238, .12);
    --card: rgba(255, 255, 255, .04);
    --card-border: rgba(255, 255, 255, .09);
    --text: #e6e9f2;
    --text-2: #9aa3b8;
    --text-3: #6b7488;
    --code-bg: #171a26;
    --code-text: #c9d0e2;
    --code-border: #242a3d;
    --frame-bar: rgba(17, 19, 26, .8);
    --shadow: 0 20px 50px -20px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 14px/1.65 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 28px;
    transition: background .3s, color .3s;
  }
  body::before, body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  body::before {
    background: radial-gradient(600px 400px at 15% 0%, var(--bg-glow-1), transparent 65%),
                radial-gradient(700px 500px at 100% 100%, var(--bg-glow-2), transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo {
    width: 46px; height: 46px; border-radius: 14px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 24px -8px var(--accent);
  }
  .logo svg { width: 24px; height: 24px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header p { font-size: 13px; color: var(--text-2); }

  .status {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 22px 24px; backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px;
    box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent);
  }
  .dot.ok { background: var(--ok); color: var(--ok); }
  .dot.warn { background: var(--warn); color: var(--warn); }
  .dot.bad { background: var(--bad); color: var(--bad); }
  .status .body { flex: 1; }
  .status h2 { font-size: 15px; font-weight: 600; }
  .status p { font-size: 13px; color: var(--text-2); margin-top: 4px; }
  .status p b { color: var(--text); font-weight: 600; }
  .status .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

  code {
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    background: var(--code-bg); border: 1px solid var(--code-border);
    color: var(--code-text); border-radius: 6px; padding: 1px 6px;
    font-size: 12.5px;
  }
  pre {
    margin: 12px 0 0; padding: 14px 16px; overflow: auto;
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: 12px; font-size: 12.5px; line-height: 1.8;
    color: var(--code-text);
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  pre .c { color: var(--text-3); }
  pre .k { color: var(--accent-2); }
  pre .s { color: #fbbf24; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 10px; padding: 8px 16px; font-size: 13px;
    cursor: pointer; text-decoration: none; transition: transform .15s, opacity .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 600; box-shadow: 0 8px 20px -8px var(--accent);
  }
  .btn-ghost {
    background: transparent; border: 1px solid var(--card-border); color: var(--text-2);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  .frame-wrap {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; overflow: hidden; backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }
  .frame-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 16px; font-size: 12.5px; color: var(--text-2);
    background: var(--frame-bar); border-bottom: 1px solid var(--card-border);
  }
  .frame-bar .addr { font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frame-bar a { color: var(--accent); text-decoration: none; flex: none; }
  .frame-bar a:hover { text-decoration: underline; }
  .esxi-frame { width: 100%; height: 74vh; border: 0; display: block; background: #fff; }

  .hidden { display: none; }
  @media (max-width: 640px) {
    body { padding: 20px 16px; }
    .esxi-frame { height: 68vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
      </svg>
    </div>
    <div>
      <h1>ESXi 管理</h1>
      <p>在门户中直接访问 ESXi 内置 Web 管理界面</p>
    </div>
  </header>

  <div class="status hidden" id="status">
    <span class="dot" id="statusDot"></span>
    <div class="body">
      <h2 id="statusTitle"></h2>
      <div id="statusDesc"></div>
      <div class="actions" id="statusActions"></div>
    </div>
  </div>

  <div class="frame-wrap hidden" id="frameWrap">
    <div class="frame-bar">
      <span class="addr" id="frameAddr"></span>
      <a id="openNew" href="#" target="_blank" rel="noopener">在新窗口打开</a>
    </div>
    <iframe class="esxi-frame" id="esxiFrame" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
  </div>
</div>

<script>
const API = '/api/v1/plugins/native/esxi-admin';
const PROVIDER_CN = { esxi: 'VMware ESXi', workstation: 'VMware Workstation', mock: 'Mock（演示数据）' };

// ---- 主题同步：读 localStorage portalt-theme（与 useTheme.ts 同键）----
function applyTheme() {
  const saved = localStorage.getItem('portalt-theme');
  const dark = saved === 'dark'
    || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}
applyTheme();
// 门户侧切换主题会写 localStorage → 跨同源 iframe 触发 storage 事件
window.addEventListener('storage', e => { if (e.key === 'portalt-theme') applyTheme(); });
// 兜底：直接观察父窗口 html.dark class（同源）
try {
  const parentEl = window.parent.document.documentElement;
  if (parentEl && parentEl !== document.documentElement) {
    new MutationObserver(() => {
      const dark = parentEl.classList.contains('dark');
      document.documentElement.classList.toggle('dark', dark);
    }).observe(parentEl, { attributes: true, attributeFilter: ['class'] });
  }
} catch (e) { /* 跨域时忽略，storage 事件已兜底 */ }

function token() {
  const m = document.cookie.match(/(?:^|;\s*)access_token=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

async function call(path) {
  const res = await fetch(API + path, { headers: { Authorization: 'Bearer ' + token() } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || ('HTTP ' + res.status));
  return body.data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const status = document.getElementById('status');
const frameWrap = document.getElementById('frameWrap');

function showStatus(kind, title, descHtml, actionsHtml) {
  const dot = document.getElementById('statusDot');
  dot.className = 'dot ' + kind;
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusDesc').innerHTML = descHtml;
  document.getElementById('statusActions').innerHTML = actionsHtml;
  status.classList.remove('hidden');
}

function openFrame(url) {
  document.getElementById('esxiFrame').src = url;
  document.getElementById('frameAddr').textContent = url;
  document.getElementById('openNew').href = url;
  document.getElementById('frameAddr').title = url;
  status.classList.add('hidden');
  frameWrap.classList.remove('hidden');
}

async function render() {
  try {
    const cfg = await call('/config');
    const cn = PROVIDER_CN[cfg.provider] || cfg.provider;

    if (cfg.web_url) {
      openFrame(cfg.web_url);
      return;
    }
    if (cfg.connected) {
      showStatus('warn', '已连接，缺少 Web 界面地址',
        `<p>当前平台为 <b>${esc(cn)}</b>，但未配置可嵌入的管理界面。在 <code>backend/.env</code> 配置 <code>ESXI_WEB_URL</code>，或不配置时从 <code>VIRT_URL</code> 自动推导：</p>` +
        `<pre><span class="k">ESXI_WEB_URL</span>=https://&lt;esxi-host&gt;/ui/   <span class="c"># 默认: VIRT_URL 的 /sdk → /ui/</span></pre>`,
        `<a class="btn btn-primary" href="/plugins/esxi-admin" onclick="setTimeout(()=>location.reload(),600)">重新加载</a>`);
      return;
    }
    showStatus('bad', 'ESXi 未连接',
      `<p>当前虚拟化平台为 <b>${esc(cn)}</b>，暂无 ESXi Web 界面可嵌入。连接真实 ESXi 的配置方式（<code>backend/.env</code>）：</p>` +
      `<pre><span class="k">VIRT_PROVIDER</span>=esxi
<span class="k">VIRT_URL</span>=<span class="s">https://&lt;esxi-host&gt;/sdk</span>
<span class="k">VIRT_USERNAME</span>=<span class="s">&lt;账号&gt;</span>
<span class="k">VIRT_PASSWORD</span>=<span class="s">&lt;密码&gt;</span>
<span class="k">VIRT_INSECURE</span>=true   <span class="c"># 自签名证书时设为 true</span></pre>
      <p>Web 界面地址默认从 <code>VIRT_URL</code> 推导，也可用 <code>ESXI_WEB_URL</code> 覆盖。修改后重启后端：<code>go run ./cmd/server</code>。</p>`,
      `<button class="btn btn-ghost" onclick="location.reload()">重新检测</button>`);
  } catch (e) {
    showStatus('warn', '配置加载失败', `<p>${esc(e.message)}</p>`,
      `<button class="btn btn-ghost" onclick="location.reload()">重试</button>`);
  }
}

render();
</script>
</body>
</html>
