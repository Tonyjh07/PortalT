<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESXi 管理</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141414; color: #e6e6e6;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  h1 { font-size: 18px; margin-bottom: 16px; color: #fff; }
  .notice {
    background: #1e1e2e; border: 1px solid #3a3a5c; border-radius: 8px;
    padding: 14px 18px; margin-bottom: 18px; font-size: 13px;
  }
  .notice h2 { margin: 0 0 8px; color: #fbbf24; font-size: 15px; }
  .notice p { margin: 4px 0; color: #c9c9d6; }
  .notice b { color: #fff; }
  .notice pre {
    background: #14141f; border: 1px solid #2d2d44; border-radius: 6px;
    padding: 10px 12px; margin: 8px 0; font-size: 12px; overflow: auto;
  }
  .notice code { background: #14141f; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .frame-wrap {
    border: 1px solid #2e2e2e; border-radius: 8px; overflow: hidden;
    background: #0d0d0d; margin-bottom: 18px;
  }
  .frame-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #1c1c1c; border-bottom: 1px solid #2e2e2e;
    font-size: 13px; color: #9d9d9d;
  }
  .frame-bar a { color: #60a5fa; text-decoration: none; }
  .frame-bar a:hover { text-decoration: underline; }
  .esxi-frame { width: 100%; height: 72vh; border: 0; display: block; }
  details {
    background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 8px;
    padding: 10px 14px; margin-top: 18px;
  }
  summary { cursor: pointer; color: #9d9d9d; font-size: 13px; font-weight: 600; user-select: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
  .card { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 8px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: #8a8a8a; }
  .card .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
  th { color: #8a8a8a; font-weight: 500; }
  td.name { font-weight: 600; }
  .state { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .state.on { background: #14331c; color: #4ade80; }
  .state.off { background: #33231c; color: #fb923c; }
  .state.sus { background: #2a2133; color: #c4b5fd; }
  button {
    background: #2d2d2d; color: #e6e6e6; border: 1px solid #3d3d3d;
    border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 13px; color: #fbbf24; }
  .msg.err { color: #f87171; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>ESXi 管理（示例原生插件）</h1>

<!-- Web 管理界面 iframe（可嵌入时显示） -->
<div class="frame-wrap hidden" id="frameWrap">
  <div class="frame-bar">
    <span id="frameTitle">ESXi Web 管理界面</span>
    <a id="openNew" href="#" target="_blank" rel="noopener">在新窗口打开 ↗</a>
  </div>
  <iframe class="esxi-frame" id="esxiFrame" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
</div>

<!-- 未连接 / 未配置提示 -->
<div class="notice hidden" id="notice">
  <h2 id="noticeTitle">ESXi 未连接</h2>
  <div id="noticeBody"></div>
</div>

<details id="tools">
  <summary>宿主机信息 / 快速操作</summary>
  <div class="cards" id="hostCards"></div>
  <div class="msg hidden" id="msg"></div>
  <table>
    <thead><tr><th>名称</th><th>状态</th><th>IP</th><th>系统</th><th>CPU</th><th>内存</th><th>操作</th></tr></thead>
    <tbody id="vmRows"></tbody>
  </table>
</details>

<script>
const API = '/api/v1/plugins/native/esxi-admin';

function token() {
  const m = document.cookie.match(/(?:^|;\s*)access_token=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

async function call(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token() },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || ('HTTP ' + res.status));
  return body.data;
}

const PROVIDER_CN = { esxi: 'VMware ESXi', workstation: 'VMware Workstation', mock: 'Mock（演示数据）' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function renderConfig() {
  const cfg = await call('/config');
  const frameWrap = document.getElementById('frameWrap');
  const notice = document.getElementById('notice');
  const title = document.getElementById('noticeTitle');
  const body = document.getElementById('noticeBody');
  const providerCn = PROVIDER_CN[cfg.provider] || cfg.provider;

  if (cfg.web_url) {
    document.getElementById('esxiFrame').src = cfg.web_url;
    document.getElementById('frameTitle').textContent =
      'ESXi Web 管理界面（' + cfg.web_url + '）';
    document.getElementById('openNew').href = cfg.web_url;
    frameWrap.classList.remove('hidden');
    notice.classList.add('hidden');
  } else if (cfg.connected) {
    // ESXi 已连接，但未配置可嵌入的 Web 界面地址
    title.textContent = 'ESXi 已连接，未配置 Web 管理界面地址';
    body.innerHTML =
      '<p>当前为 <b>' + esc(providerCn) + '</b>，但缺少 Web 界面地址，无法 iframe 嵌入。</p>' +
      '<p>在 <code>backend/.env</code> 中配置：</p>' +
      '<pre>ESXI_WEB_URL=https://&lt;esxi-host&gt;/ui/   # 覆盖自动推导</pre>' +
      '<p>不配置时会从 <code>VIRT_URL</code> 自动推导（<code>https://&lt;esxi-host&gt;/ui/</code>）。修改后重启后端。</p>';
    frameWrap.classList.add('hidden');
    notice.classList.remove('hidden');
  } else {
    title.textContent = 'ESXi 未连接';
    body.innerHTML =
      '<p>当前虚拟化平台为 <b>' + esc(providerCn) + '</b>，暂无 ESXi Web 界面可嵌入。</p>' +
      '<p>连接真实 ESXi 的配置方式（<code>backend/.env</code>）：</p>' +
      '<pre>VIRT_PROVIDER=esxi\n' +
      'VIRT_URL=https://&lt;esxi-host&gt;/sdk\n' +
      'VIRT_USERNAME=&lt;账号&gt;\n' +
      'VIRT_PASSWORD=&lt;密码&gt;\n' +
      'VIRT_INSECURE=true   # 自签名证书时设为 true</pre>' +
      '<p>修改后重启后端：<code>go run ./cmd/server</code>。Web 界面地址默认从 <code>VIRT_URL</code> 推导，' +
      '也可用 <code>ESXI_WEB_URL</code> 覆盖。下方"宿主机信息"仍会展示当前平台的真实数据。</p>';
    frameWrap.classList.add('hidden');
    notice.classList.remove('hidden');
  }
}

function msg(text, isErr) {
  const el = document.getElementById('msg');
  el.classList.remove('hidden');
  el.classList.toggle('err', !!isErr);
  el.textContent = text;
  setTimeout(() => el.classList.add('hidden'), 3000);
}

function stateCls(s) {
  const v = String(s || '').toLowerCase();
  if (v === 'poweredon') return 'on';
  if (v === 'poweredoff') return 'off';
  return 'sus';
}

const STATE_CN = { poweredon: '运行中', poweredoff: '已关机', suspended: '挂起' };

async function renderHost() {
  try {
    const info = await call('/host');
    const items = [
      ['产品', info.product], ['版本', info.version], ['CPU', info.cpu_model],
      ['核心数', info.total_cpu + ' 核'], ['内存', (info.total_memory_mb / 1024).toFixed(0) + ' GB'],
      ['主机名', info.name], ['状态', info.status], ['厂商', info.vendor],
    ];
    document.getElementById('hostCards').innerHTML = items
      .filter(([, v]) => v !== undefined && v !== null && v !== '')
      .map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`)
      .join('');
  } catch (e) {
    document.getElementById('hostCards').innerHTML =
      `<div class="card"><div class="k">宿主机</div><div class="v" style="color:#f87171">${esc(e.message)}</div></div>`;
  }
}

async function renderVMs() {
  try {
    const vms = await call('/vms');
    document.getElementById('vmRows').innerHTML = vms.map(vm => {
      const cls = stateCls(vm.state);
      const ops = cls === 'on'
        ? `<button onclick="power('${vm.id}','stop')">关机</button> <button onclick="power('${vm.id}','restart')">重启</button>`
        : `<button onclick="power('${vm.id}','start')">开机</button>`;
      return `<tr>
        <td class="name">${esc(vm.name)}</td>
        <td><span class="state ${cls}">${esc(STATE_CN[vm.state] || vm.state)}</span></td>
        <td>${esc(vm.ip)}</td><td>${esc(vm.os)}</td>
        <td>${esc(vm.cpu)}</td><td>${esc(vm.memory)} MB</td>
        <td>${ops}</td></tr>`;
    }).join('');
  } catch (e) {
    msg('加载 VM 列表失败: ' + e.message, true);
  }
}

async function power(id, op) {
  try {
    await call(`/vms/${id}/${op}`, { method: 'POST' });
    msg('操作已下发');
    renderVMs();
  } catch (e) {
    msg('操作失败: ' + e.message, true);
  }
}

renderConfig().catch(e => {
  document.getElementById('noticeTitle').textContent = '配置加载失败';
  document.getElementById('noticeBody').innerHTML = '<p>' + esc(e.message) + '</p>';
  document.getElementById('notice').classList.remove('hidden');
});
renderHost();
renderVMs();
</script>
</body>
</html>
